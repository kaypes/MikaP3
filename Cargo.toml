[package]
name = "MikaP3"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "MikaP3"
path = "src/main.rs"
test = false
bench = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"

embassy-executor = { version = "0.9.1", features = ["executor-thread", "arch-cortex-m"] }
embassy-time = "0.5.0"
embassy-rp = { version = "0.9.0", features = [
    "rp2040",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "intrinsics",
    "boot2-w25q080"
] }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"

cyw43 = { version = "0.6.0", features = ["firmware-logs"] }
cyw43-pio = "0.9.0"
embassy-net = { version = "0.8.0", features = ["tcp", "udp", "dhcpv4", "medium-ethernet"] }

embedded-graphics = "0.8.1"
ssd1306 = "0.10.0"
display-interface-i2c = "0.5.0"

smart-leds = "0.4.0"

fixed = "1.30.0"
static_cell = "2.1.1"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
panic-halt = "1.0.0"
heapless = "0.9.2"
pio = "0.3.0"

[profile.release]
debug = 2
lto = true
opt-level = "z"
