[package]
name = "MikaP3"
version = "0.1.0"
edition = "2024"

[lib]
name = "mikap3"

[[bin]]
name = "MikaP3"
path = "src/main.rs"
test = false
bench = false

[dependencies]
embedded-graphics = "0.8.1"
heapless = "0.9.2"
itoa = "1.0.18"

[target.'cfg(all(target_arch = "arm", target_os = "none"))'.dependencies]
cortex-m-rt = "0.7.5"

embassy-executor = { version = "0.9.1", features = ["executor-thread", "arch-cortex-m"] }
embassy-time = "0.5.0"
embassy-rp = { version = "0.9.0", features = [
    "rp2040",
    "unstable-pac",
    "time-driver",
    "critical-section-impl",
    "intrinsics",
    "boot2-w25q080"
] }
embassy-sync = "0.7.2"
embassy-futures = "0.1.2"

ssd1306 = { version = "0.10.0", features = ["async"] }

fixed = "1.30.0"
portable-atomic = { version = "1.13.1", features = ["critical-section"] }
panic-halt = "1.0.0"
pio = "0.3.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
